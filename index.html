<style>

@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes beckon{0%,100%{transform:translateY(0) scale(1,1)}22%{transform:translateY(-10px) scale(.96,1.06)}44%{transform:translateY(0) scale(1.06,.93)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
@keyframes wavel{0%,100%{transform:rotate(142deg)}50%{transform:rotate(176deg)}}
@keyframes shake{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
@keyframes wave{0%,100%{transform:rotate(-142deg)}50%{transform:rotate(-176deg)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-15deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{from{opacity:.7}to{opacity:1}}
@keyframes hop{0%{transform:scale(1,1)}18%{transform:scale(1.1,.84)}45%{transform:translateY(-22px) scale(.93,1.12)}72%{transform:translateY(0) scale(1.1,.86)}100%{transform:scale(1,1)}}
@media (prefers-reduced-motion:reduce){.mascot *{animation:none!important}}
.beacon{--b:var(--ok);width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative}
.beacon i{width:44px;height:44px;border-radius:50%;background:var(--b)}
.beacon::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--b);animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.62);opacity:.9}100%{transform:scale(1.1);opacity:0}}
.beacon.soon{--b:var(--warn-c)}.beacon.exp,.beacon.bad{--b:var(--bad)}
@media (prefers-reduced-motion:reduce){.orb.g i,.beacon::after{animation:none}}
.bubble{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:11px 13px;font-size:15px;font-weight:500}
.garde{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;background:var(--blue-bg);color:var(--blue);font-weight:600}
.garde .x{flex:1}
.garde button{background:transparent;border-color:var(--blue);color:var(--blue)}
.gfab{position:fixed;right:16px;bottom:88px;width:60px;height:60px;border-radius:50%;padding:0;background:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:22;display:grid;place-items:center;border:0}
.gfab .mascot{width:52px;height:60px;pointer-events:none}
@media (max-width:899px){.shell:not(.crew) .gfab{bottom:88px}}
.shell.crew .gfab{right:calc(50% - 215px + 16px)}
@media (min-width:900px){.gfab{bottom:24px}}
.segg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.segg button{min-height:52px;border-radius:12px;font-weight:600}
.segg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;min-height:56px}
.chk .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.chk.on .box{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.chk.on .box .ico{width:16px;height:16px}
.chk span b{display:block}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stp{display:flex;align-items:center;gap:12px}
.stp button{width:40px;height:40px;border-radius:50%;font-size:20px;padding:0}
.stp b{font-size:20px;min-width:28px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.kc{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:8px 12px;min-height:40px}
.kc.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.stack{display:flex;flex-direction:column;gap:8px}
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:960px){.home{grid-template-columns:1fr}}
.vgrid{align-items:start}
.vh b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtb .pill{white-space:normal}
.foot{font-size:12.5px;color:var(--muted);max-width:80ch;margin-top:12px}

/* ===== Gyrolog : nouvelle identité ===== */
:root{--bg:#F3F5FB;--surface:#FFFFFF;--ink:#12183A;--muted:#5A6285;--line:#E3E7F1;--hair:#EDF0F7;--accent:#4B3CDB;--on-accent:#FFFFFF;--ok:#0B6B4A;--ok-bg:#E2F7EE;--warn:#8A4B00;--warn-bg:#FFF1DB;--warn-c:#F59E0B;--bad:#B4233D;--bad-bg:#FDECEF;--blue:#4B3CDB;--blue-bg:#E9E6FF;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Figtree",system-ui,sans-serif;--disp:"Bricolage Grotesque","Figtree",system-ui,sans-serif;--fun:"Baloo 2","Figtree",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F0A33;--surface:#1B1358;--ink:#F2F0FF;--muted:#B9B4F0;--line:#33298A;--hair:#241B66;--accent:#8B6CFF;--on-accent:#FFFFFF;--ok:#2CF0B4;--ok-bg:#0F3A3A;--warn:#FFC24B;--warn-bg:#3A2B0B;--warn-c:#FFC24B;--bad:#FF9AA3;--bad-bg:#4A1A2A;--blue:#B9A8FF;--blue-bg:#2A2078}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F0A33;--surface:#1B1358;--ink:#F2F0FF;--muted:#B9B4F0;--line:#33298A;--hair:#241B66;--accent:#8B6CFF;--on-accent:#FFFFFF;--ok:#2CF0B4;--ok-bg:#0F3A3A;--warn:#FFC24B;--warn-bg:#3A2B0B;--warn-c:#FFC24B;--bad:#FF9AA3;--bad-bg:#4A1A2A;--blue:#B9A8FF;--blue-bg:#2A2078}
.shell.crew{color:var(--ink);color-scheme:dark;--bg:#120B3A;--surface:rgba(255,255,255,.08);--ink:#FFFFFF;--muted:#B9B4F0;--line:rgba(255,255,255,.14);--hair:rgba(255,255,255,.1);--accent:#2CF0B4;--on-accent:#120B3A;--ok:#2CF0B4;--ok-bg:rgba(44,240,180,.14);--warn:#FFC24B;--warn-bg:rgba(255,194,75,.14);--warn-c:#FFC24B;--bad:#FF9AA3;--bad-bg:rgba(255,92,108,.16);--blue:#B9A8FF;--blue-bg:rgba(139,108,255,.25)}
.assu{--tc:#4B3CDB}.catc{--tc:#0E7490}.vsl{--tc:#7A5CFF}.taxi{--tc:#B4337F}
body{padding:0!important;font-size:15px}
body.crew{background:#170F4C linear-gradient(180deg,#1F1560 0%,#120B3A 100%) fixed}html:has(body.crew){background:#170F4C}
h1,h2{font-family:var(--disp);letter-spacing:-.01em}
.wrap{max-width:none;margin:0;display:block}
.shell{display:flex;min-height:100vh}
.side{width:240px;flex:none;position:sticky;top:0;height:100vh;background:#14103F;color:#C9C6F5;padding:26px 16px;display:flex;flex-direction:column;gap:6px}
.side .logo{display:flex;align-items:center;gap:12px;padding:0 10px 20px;font-family:var(--disp);font-weight:800;font-size:23px;color:#fff}
.side .logo i{width:38px;height:38px;border-radius:12px;background:#FF5C6C;display:grid;place-items:center}
.side .logo i b{width:16px;height:16px;border-radius:50%;background:#FFF3B8}
.side button.nv,.bnav button.nv{display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#C9C6F5;padding:12px 14px;border-radius:14px;font-weight:600;font-size:16px;text-align:left;min-height:46px;width:100%}
.side button.nv.on{background:#4B3CDB;color:#fff;font-weight:700}
.side button.nv .bdg{margin-left:auto}
.side .sp{flex:1}
.side .sm2{font-size:13px;color:#C9C6F5;padding:0 10px 6px}
.side button.gh2{background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:14px;min-height:46px;font-weight:700}

function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}

function fixToks(toks){const V=vocab();return toks.map(t=>{const d=dep(t);if(d.length<4||V.has(d))return t;let best=null,bd=9;V.forEach(w=>{const x=lev(d,w);if(x<bd){bd=x;best=w}});return bd<=(d.length>=8?2:1)?best:t})}

function cleanAiText(raw){

// Le modèle laisse parfois fuir son raisonnement brut, suivi (collé, sans séparateur, avec ou
// sans guillemets autour) d'une répétition — parfois légèrement reformulée — de la réponse déjà
// évoquée plus haut : c'est cette dernière occurrence qui est la vraie réponse. Deux méthodes
// complémentaires pour la retrouver, combinées ci-dessous.
const stripQ=s=>s.replace(/["'“”«»]/g,'');
const norm=s=>stripQ(s).replace(/\s+/g,' ').trim();
const looksClean=s=>!!s&&s.length>=10&&/^[A-ZÀ-ÖØ-Þ«“"]/.test(s.trim())&&!/\*|Draft|Constraint|Self-correction|Self-Correction|Final Version|Final Polish|Refining|Wait,/i.test(s);
// A) plus longue fin de texte qui réapparaît mot pour mot plus tôt dans le texte (duplication exacte).
const full=norm(t);
const maxL=Math.min(700,Math.floor(full.length/2));
let bestNorm=null;
for(let L=maxL;L>=20;L--){
const suf=full.slice(full.length-L);
const rest=full.slice(0,full.length-L);
if(rest.indexOf(suf)>=0){bestNorm=suf;break}
}
let candA=null;
if(bestNorm){
for(let L2=Math.min(t.length,bestNorm.length+80);L2>=Math.max(10,bestNorm.length-20);L2--){
const cand=t.slice(t.length-L2).trim();
if(norm(cand)===bestNorm){candA=cand.replace(/^["'“«]+/,'').trim();break}
}
if(!candA)candA=bestNorm;
}
// B) texte après le tout dernier vrai guillemet (pas une apostrophe) du message : couvre le cas où
// la réponse finale reformule légèrement le dernier brouillon cité, sans le reproduire à l'identique.
let candB=null;
const qRe=/[“”«»"]/g;let qm,lastQ=-1;
while((qm=qRe.exec(t))){lastQ=qm.index}
if(lastQ>=0){const tail=t.slice(lastQ+1).trim();if(tail.length>=15)candB=tail}
const validA=looksClean(candA),validB=looksClean(candB);
if(validA)return candA;
if(validB)return candB;
// Repli : si un paragraphe final court et sans puces suit un saut de ligne, c'est
// probablement la réponse propre (cas où le modèle sépare bien réflexion et réponse).
const paras=t.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);

const lastPara=paras[paras.length-1];

function parseDateCell(v){if(v==null||v==='')return null;
if(v instanceof Date)return v.getFullYear()+'-'+pad(v.getMonth()+1);
if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400*1000));return isNaN(d)?null:d.getFullYear()+'-'+pad(d.getMonth()+1)}
const s=String(v).trim();if(!s)return null;
let m=s.match(/^(\d{4})[-\/](\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2]);
m=s.match(/^(\d{1,2})[\/.\-](\d{4})$/);if(m)return m[2]+'-'+pad(+m[1]);
m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(m)return m[3]+'-'+pad(+m[2]);
const d2=new Date(s);if(!isNaN(d2))return d2.getFullYear()+'-'+pad(d2.getMonth()+1);
return null}
function parseCSVText(text){const lines=text.replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(l=>l.trim().length);if(!lines.length)return[];
const delim=(lines[0].split(';').length>=lines[0].split(',').length)?';':',';
const splitLine=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===delim&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out};
const head=splitLine(lines[0]).map(h=>norm(h));
return lines.slice(1).map(l=>{const c=splitLine(l),o={};head.forEach((h,i)=>o[h]=c[i]);return o})}
function mapImportRow(o){const keys=Object.keys(o);const find=re=>{const k=keys.find(k=>re.test(k));return k?o[k]:''};
const cat=find(/emplacement|^zone$|^kit$/)||find(/kit/);const art=find(/^article$|^nom$/)||find(/article/);const qty=find(/quant/);const dt=find(/date|peremption/);
return{cat:String(cat||'').trim(),article:String(art||'').trim(),qty:qty,exp:parseDateCell(dt)}}
async function readImportFile(file){const name=file.name.toLowerCase();
if(name.endsWith('.csv')){const text=await file.text();return parseCSVText(text).map(mapImportRow).filter(r=>r.cat&&r.article)}
if(typeof XLSX==='undefined')throw new Error('La lecture des fichiers .xlsx n\'est pas disponible (pas de connexion internet ?). Utilise un fichier .csv à la place.');
const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];
const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
let hi=raw.findIndex(row=>row.some(c=>/article/i.test(String(c))));if(hi<0)hi=0;
const headers=raw[hi].map(h=>norm(h));
const rows=raw.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!==''));
return rows.map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]);return o}).map(mapImportRow).filter(r=>r.cat&&r.article)}

function splitTarget(g){if(g.w==='s'){const e=S.stock.find(x=>x.id===g.e);return{ent:e,lot:e.lots.find(x=>x.id===+g.l),name:e.n}}const ow=ownOf(g.t,g.o),it=ow.items.find(x=>x.id===+g.i);return{ow,it,lot:it.lots.find(x=>x.id===+g.l),name:it.n}}
function readKit(g){if(!g||(g.k!=='kitedit'&&g.k!=='zedit'))return;g.items=g.items.map((i,x)=>{const n=$('kin'+x),q=$('kiq'+x),d=$('kid'+x);return{...i,n:n?n.value.trim():i.n,q:q?Math.max(1,+q.value||1):i.q,exp:d?(d.value||null):i.exp}})}
function setVal(k,val){val=val.trim();const P=k.split(':'),a=P[0],b=P[1];
if(a==='ec'){const e=S.stock.find(x=>x.id===P[1]);if(e){e.cat=val;e.sub=null}return}
if(a==='es'){const e=S.stock.find(x=>x.id===P[1]);if(e)e.sub=val||null;return}
if(a==='ef'&&P[1]==='n'){const e=S.stock.find(x=>x.id===P[2]);if(e){if(!renameEntry(e,val))S.toast='Ce nom existe déjà dans le catalogue.'}return}
if(a==='ef'){const e=S.stock.find(x=>x.id===P[2]);if(e)e[P[1]]=['pack','max','price','lead'].includes(P[1])?(val===''?'':Math.max(0,+val||0)):val;return}
if(a==='ea'){const e=S.stock.find(x=>x.id===P[2]);if(e){e.attr=e.attr||{};if(val)e.attr[P[1]]=val;else delete e.attr[P[1]]}return}
if(a==='an'){const at=S.attrs.find(x=>x.id===P[1]);if(at&&val)at.n=val;return}
if(a==='av'){const at=S.attrs.find(x=>x.id===P[1]),i=+P[2];if(at&&val){S.stock.forEach(e=>{if(e.attr&&e.attr[at.id]===at.vals[i])e.attr[at.id]=val});at.vals[i]=val}return}
if(a==='ci'){const c=S.cats.find(x=>x.id===P[1]);if(c)c.icon=val;return}
if(a==='cn'){const c=S.cats.find(x=>x.id===P[1]);if(c&&val)c.n=val;return}
if(a==='sn'){const c=S.cats.find(x=>x.id===P[1]),u=c&&c.subs.find(x=>x.id===P[2]);if(u&&val)u.n=val;return}
if(a==='le'){const e=S.stock.find(x=>x.id===P[1]),l=e&&e.lots.find(x=>x.id===+P[2]);if(l)l.exp=val||null;return}
if(a==='in'||a==='ie'){const ow=ownOf(P[1],P[2]),it=ow&&ow.items.find(x=>x.id===+P[3]);if(it){if(a==='in'){if(val)it.n=val}else{const l=it.lots.find(x=>x.id===+P[4]);if(l)l.exp=val||null;syncItem(it)}if(P[1]==='k')syncKit(ow)}return}
if(a==='dg'){const c=S.dg.find(x=>x.id===P[1]);if(c&&P[2])c[P[2]]=P[2]==='name'?(val||c.name):val;return}
if(a==='cst'){const v=veh(P[1]),o=v&&v.cons[P[2]];if(o)o[P[3]]=Math.max(0,Math.round(+val)||0);return}
if(a==='csa'){const c=P[1],n=Math.max(0,Math.round(+val)||0);S.veh.forEach(v=>{if(v.cons[c])v.cons[c].min=n});return}
if(a==='o2mv'){const n=Math.max(10,Math.min(100,Math.round(+val)||10));S.veh.forEach(x=>(x.o2||[]).forEach(bo=>bo.min=n));return}
if(a==='mst'){const e=S.stock.find(x=>x.id===P[1]);if(e)e.min=Math.max(0,Math.round(+val)||0);return}
if(a==='lst'){const e=S.stock.find(x=>x.id===P[1]),l=e&&e.lots.find(x=>x.id===+P[2]);if(l){const q0=l.q,n=Math.max(0,Math.round(+val)||0);l.q=n;if(n!==q0)mv(e,'Ajustement '+(n>q0?'+':'')+(n-q0)+' · inventaire')}return}
if(a==='ist'){const ow=ownOf(P[1],P[2]),it=ow&&ow.items.find(x=>x.id===+P[3]),l=it&&it.lots.find(x=>x.id===+P[4]);if(l){l.q=Math.max(1,Math.round(+val)||1);syncItem(it);if(P[1]==='k')syncKit(ow)}return}
if(a==='rcn'){const v=veh(P[1]),c=v&&v.cons[P[2]];if(c)c.q=Math.max(0,Math.round(+val)||0);return}
if(a==='cfg.company')S.cfg.company=val||'Mon entreprise';else if(a==='cfg.nameA')S.cfg.nameA=val||'Gyrolog';else if(a==='cfg.nameG')S.cfg.nameG=val||'Gyro';else if(a==='cfg.aiKey')S.cfg.aiKey=(val||'').trim();
else if(a==='vname'){const v=veh(S.setv);if(v&&val)v.name=val}
else if(a==='vimmat'){const v=veh(S.setv);if(v)v.immat=val}
else if(a==='vct'){const v=veh(S.setv);if(v)v.ct=val||null}
else if(a==='gg'){const v=veh(S.setv),old=grp(v)[+b];if(old!==undefined&&val)v.zones.forEach(z=>{if(z.g===old)z.g=val})}
else if(a==='zs'){const v=veh(S.setv),z=v&&v.zones.find(x=>x.id===+b);if(z)z.s=val}
else if(a==='kn'){const v=veh(S.setv),kk=v&&v.kits.find(x=>x.id===b);if(kk&&val)kk.name=val}
else if(a==='eq'){const i=+b,old=S.eq[i];if(val&&old!==undefined){S.eq[i]=val;if(S.by===old)S.by=val;if(S.resp[old]){delete S.resp[old];S.resp[val]=true}if(S.role[old]){const r=S.role[old];delete S.role[old];S.role[val]=r}}}
else if(a==='role'){const i=+b,n=S.eq[i];if(n&&val)S.role[n]=val}}
function doConf(g){if(g.a==='vdel'){S.veh=S.veh.filter(x=>x.id!==g.id);if(S.gv===g.id)S.gv=S.veh.find(isAmb)?S.veh.find(isAmb).id:S.veh[0].id;S.set='veh';S.setv=null;S.sel=null}
else if(g.a==='zdel'){const v=veh(S.setv),z0=v.zones.find(x=>x.id===+g.id),gn=z0&&z0.g;v.zones=v.zones.filter(x=>x.id!==+g.id);if(gn&&!v.zones.some(x=>x.g===gn))v.zones.push(Z(gn,'','bag',[],false))}
else if(g.a==='ggdel'){const v=veh(S.setv),gn=grp(v)[+g.id];v.zones=v.zones.filter(x=>x.g!==gn)}
else if(g.a==='cdel'){const v=veh(S.setv);delete v.cons[g.id];if(!S.veh.some(x=>x.cons[g.id])){delete CONS[g.id];Object.keys(S.prof).forEach(t=>{S.prof[t]=S.prof[t].filter(p=>p.c!==g.id)})}}
else if(g.a==='idel'){const ow=ownOf(g.t,g.o);ow.items=ow.items.filter(x=>x.id!==+g.i);if(g.t==='k')syncKit(ow)}
else if(g.a==='edel'){S.stock=S.stock.filter(x=>x.id!==g.id)}
else if(g.a==='catdel'){if(S.sn.f===g.id)S.sn={f:'',u:''};const o=S.cats[S.cats.length-1].id;S.stock.forEach(e=>{if(e.cat===g.id){e.cat=o;e.sub=null}});S.cats=S.cats.filter(c=>c.id!==g.id)}
else if(g.a==='subdel'){const c=S.cats.find(x=>x.id===g.c);c.subs=c.subs.filter(u=>u.id!==g.u);S.stock.forEach(e=>{if(e.sub===g.u)e.sub=null})}
else if(g.a==='attrdel'){S.attrs=S.attrs.filter(a=>a.id!==g.id);S.stock.forEach(e=>{if(e.attr)delete e.attr[g.id]});if(S.sf.a===g.id)S.sf={a:'',v:''}}
else if(g.a==='valdel'){const at=S.attrs.find(a=>a.id===g.id),v=at.vals[+g.i];at.vals.splice(+g.i,1);S.stock.forEach(e=>{if(e.attr&&e.attr[at.id]===v)delete e.attr[at.id]});if(S.sf.a===at.id)S.sf={a:'',v:''}}
else if(g.a==='kdel'){const v=veh(S.setv);v.kits=v.kits.filter(x=>x.id!==g.id)}
else if(g.a==='eqdel'){const old=S.eq[+g.id];S.eq.splice(+g.id,1);delete S.resp[old];delete S.role[old];if(S.by===old)S.by=S.eq[0]}
else if(g.a==='tdel'){const id=+g.id;S.tasks=(S.tasks||[]).filter(t=>t.id!==id)}}
